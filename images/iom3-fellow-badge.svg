<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer gold circle -->
  <circle cx="100" cy="100" r="98" fill="#C89B1A"/>
  <!-- Inner darker circle -->
  <circle cx="100" cy="100" r="72" fill="#A07A0E"/>
  <!-- I·M3 text -->
  <text x="100" y="105" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900" fill="#C89B1A" text-anchor="middle" letter-spacing="2">I·M3</text>
  <!-- FELLOW text -->
  <text x="100" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#C89B1A" text-anchor="middle" letter-spacing="3">FELLOW</text>
  <!-- Dots beside INSTITUTE OF -->
  <circle cx="28" cy="74" r="3.5" fill="#C89B1A"/>
  <circle cx="172" cy="74" r="3.5" fill="#C89B1A"/>
  <!-- Top arc text: INSTITUTE OF -->
  <path id="topArc" d="M 16,100 A 84,84 0 0,1 184,100" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#C89B1A">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle" letter-spacing="2">INSTITUTE OF</textPath>
  </text>
  <!-- Bottom arc text: MATERIALS, MINERALS &amp; MINING
       Rotate 180° around centre so text reads left-to-right at the bottom -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#C89B1A" transform="rotate(180,100,100)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle" letter-spacing="1">MATERIALS, MINERALS &amp; MINING</textPath>
  </text>
</svg>
